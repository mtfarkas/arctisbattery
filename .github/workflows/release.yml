name: Build and Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v1.2.3, etc.

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: ${{ matrix.goarch }}
        run: |
          $OUTPUT_NAME = "arctisbattery-windows-${{ matrix.goarch }}.exe"
          go build -ldflags="-s -w" -o $OUTPUT_NAME
          Compress-Archive -Path $OUTPUT_NAME, README.md -DestinationPath "arctisbattery-windows-${{ matrix.goarch }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arctisbattery-windows-${{ matrix.goarch }}
          path: arctisbattery-windows-${{ matrix.goarch }}.zip

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libudev-dev

      - name: Install ARM64 cross-compiler
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
        run: |
          OUTPUT_NAME="arctisbattery-linux-${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o "${OUTPUT_NAME}"
          zip "arctisbattery-linux-${{ matrix.goarch }}.zip" "${OUTPUT_NAME}" README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arctisbattery-linux-${{ matrix.goarch }}
          path: arctisbattery-linux-${{ matrix.goarch }}.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build binary
        env:
          CGO_ENABLED: 1
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          OUTPUT_NAME="arctisbattery-darwin-${{ matrix.goarch }}"
          go build -ldflags="-s -w" -o "${OUTPUT_NAME}"
          zip "arctisbattery-darwin-${{ matrix.goarch }}.zip" "${OUTPUT_NAME}" README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arctisbattery-darwin-${{ matrix.goarch }}
          path: arctisbattery-darwin-${{ matrix.goarch }}.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: List artifacts
        run: find ./artifacts -name '*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/*/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
